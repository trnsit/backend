http:
  routers:
    accounts-router:
      rule: 'PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/login`) || PathPrefix(`/api/v1/register`)'

      entryPoints:
        - web

      middlewares:
        - cors-headers
        - auth-login-rewrite
        - api-strip

      service: accounts-service

    repositories-router:
      rule: 'PathPrefix(`/api/v1/repositories`)'

      entryPoints:
        - web

      middlewares:
        - cors-headers
        - api-strip

      service: repositories-service

    scans-router:
      rule: 'PathPrefix(`/api/v1/scans`)'

      entryPoints:
        - web

      middlewares:
        - cors-headers
        - api-strip

      service: scans-service

    intelligence-router:
      rule: 'PathPrefix(`/api/v1/intelligence`)'

      entryPoints:
        - web

      middlewares:
        - cors-headers
        - api-strip

      service: intelligence-service

  # HEADERS & PATH TRANSFORMATIONS
  middlewares:
    api-strip:
      stripPrefix:
        prefixes:
          - '/api/v1'

    auth-login-rewrite:
      replacePathRegex:
        regex: '^/api/v1/auth/(login|register)(.*)'

        replacement: '/$1$2'

    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://127.0.0.1:3000"
          - "http://localhost:5173"
          - "http://127.0.0.1:5173"

        accessControlAllowHeaders:
          - "*"

        accessControlAllowCredentials: true

  # DOCKER INTERNAL SERVICES WITH LOAD BALANCER HEALTHCHECKS
  services:
    accounts-service:
      loadBalancer:
        healthCheck:
          path: /health

          interval: "10s"

          timeout: "3s"

        servers:
          - url: "http://accounts:8001"

    repositories-service:
      loadBalancer:
        healthCheck:
          path: /health

          interval: "10s"

          timeout: "3s"

        servers:
          - url: "http://repositories:8002"

    scans-service:
      loadBalancer:
        healthCheck:
          path: /health

          interval: "10s"

          timeout: "3s"

        servers:
          - url: "http://scans:8003"

    intelligence-service:
      loadBalancer:
        healthCheck:
          path: /health

          interval: "10s"

          timeout: "3s"

        servers:
          - url: "http://intelligence:8004"
